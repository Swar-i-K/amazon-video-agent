  Keyword usage guidance:
  - Use "air purifier" as the main product keyword.
  - Naturally incorporate "air purifier for dust," "air purifier for pets,"
    "air purifier for bedroom," and "air purifier for home" where relevant.
  - Use "air purifier for pet hair" carefully. Explain that the purifier
    filters airborne particles; it does not remove pet hair from floors,
    furniture, or fabrics.
  - Use "air purifier for smoke and odors" only within the product's
    stated filtration capabilities. Do not promise complete smoke or
    odor removal.
  - Use "air purifier for allergies" and "air purifier for allergies
    and asthma" as search-intent phrases, not as promises of symptom
    relief, prevention, or treatment.
  - Use "air purifier for mold" only to clarify that the purifier may
    filter some airborne particles but does not remediate mold, remove
    mold growth, or correct moisture problems.
  - Use "air purifier and humidifier" only to explain that this model
    does not humidify and is not a purifier-humidifier combination.
  - Use "air purifier for small room" and "air purifier for large room"
    with accurate room-size and air-change-rate context.
  - When mentioning 392 square feet, identify it as the manufacturer's
    AHAM Verifide room size.
  - When mentioning larger coverage figures, include the relevant
    cleaning time and do not imply the same 4.8 air changes per hour.
  - Use "best air purifier" only as a search-intent phrase, not as an
    unsupported ranking or universal claim.
  - Do not claim that the product removes all pollutants, all mold,
    all smoke, or all odors.
  - Do not claim that it prevents, treats, or cures allergies or asthma.
  - Do not claim guaranteed health benefits or medical outcomes.
  - Do not claim that the product humidifies the air.
  - Do not invent firsthand testing, customer feedback, prices,
    ratings, or sales figures.
  - Recheck the current Amazon listing before using price, rating,
    review count, availability, or included accessories in content.

