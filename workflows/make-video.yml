name: Make video

on:
  workflow_dispatch:
    inputs:
      asin:
        description: "ASIN (the folder name under projects/)"
        required: true
      mode:
        description: "script = write script.md for you to review | render = build the mp4 from script.md | all = both"
        type: choice
        default: script
        options: [script, render, all]
      voice:
        description: "Narration voice"
        type: choice
        default: edge_female
        options:
          - eleven_female
          - eleven_female_2
          - eleven_male
          - eleven_male_2
          - edge_female
          - edge_female_2
          - edge_male
          - edge_male_2
          - openai_female
          - openai_male
      angle:
        description: "Video angle (blank = automatic rotation)"
        type: choice
        default: ""
        options: ["", first_impressions, who_its_for, problem_solution, buyers_checklist, day_in_the_life, honest_pros_cons, gift_angle]
      preview_seconds:
        description: "Render only the first N seconds as a quick preview (0 = full video)"
        default: "0"
      force:
        description: "Overwrite an existing script.md / ignore the daily limit"
        type: boolean
        default: false

concurrency:
  group: video-${{ inputs.asin }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ASIN: ${{ inputs.asin }}
      MODE: ${{ inputs.mode }}
      VOICE: ${{ inputs.voice }}
      ANGLE: ${{ inputs.angle }}
      PREVIEW: ${{ inputs.preview_seconds }}
      FORCE: ${{ inputs.force }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate ASIN
        run: |
          [[ "$ASIN" =~ ^[A-Za-z0-9]{10}$ ]] || { echo "ASIN must be 10 letters/digits"; exit 1; }
          ASIN=$(echo "$ASIN" | tr a-z A-Z)
          echo "ASIN=$ASIN" >> "$GITHUB_ENV"
          [ -d "projects/$ASIN" ] || { echo "Folder projects/$ASIN not found"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Restore voice/asset cache (saves ElevenLabs credits on re-runs)
        uses: actions/cache@v4
        with:
          path: projects/${{ env.ASIN }}/.cache
          key: adagent-${{ env.ASIN }}-${{ github.run_id }}
          restore-keys: adagent-${{ env.ASIN }}-

      - name: Run
        run: |
          args=("$MODE" "$ASIN")
          if [ "$MODE" != "script" ]; then args+=(--voice "$VOICE"); fi
          if [ "$MODE" != "render" ] && [ -n "$ANGLE" ]; then args+=(--angle "$ANGLE"); fi
          if [ "$MODE" != "render" ] && [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$MODE" != "script" ] && [ "$PREVIEW" != "0" ] && [ -n "$PREVIEW" ]; then args+=(--max-seconds "$PREVIEW"); fi
          python -m adagent "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASIN }}-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            projects/${{ env.ASIN }}/out/*.mp4
            projects/${{ env.ASIN }}/out/*.txt
            projects/${{ env.ASIN }}/out/*.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Save script + anti-duplication history
        if: success()
        run: |
          git config user.name "adagent"
          git config user.email "adagent@users.noreply.github.com"
          git add "projects/$ASIN/script.md" scripts_archive || true
          git diff --cached --quiet || { git commit -m "script/history for $ASIN"; git pull --rebase -q; git push; }
