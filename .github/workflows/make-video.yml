name: Make video

on:
  workflow_dispatch:
    inputs:
      asin:
        description: "Project folder name under projects/ (a product ASIN, or a comparison folder)"
        required: true
      mode:
        description: "script = write script.md | render = build the mp4 from script.md | all = both | scenes = plan AI clip scenes"
        type: choice
        default: script
        options: [script, render, all, scenes]
      length:
        description: "Video length: standard = 5-9 min, short = 1.5-4.8 min"
        type: choice
        default: standard
        options: [standard, short]
      voice:
        description: "Narration voice"
        type: choice
        default: edge_female
        options:
          - eleven_female
          - eleven_female_2
          - eleven_male
          - eleven_male_2
          - edge_female
          - edge_female_2
          - edge_male
          - edge_male_2
          - openai_female
          - openai_male
      angle:
        description: "Video angle (blank = automatic rotation)"
        type: choice
        default: ""
        options: ["", first_impressions, who_its_for, problem_solution, buyers_checklist, day_in_the_life, honest_pros_cons, gift_angle]
      preview_seconds:
        description: "Render only the first N seconds as a quick preview (0 = full video)"
        default: "0"
      force:
        description: "Overwrite an existing script.md / ignore the daily limit"
        type: boolean
        default: false

concurrency:
  group: video-${{ inputs.asin }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ASIN: ${{ inputs.asin }}
      MODE: ${{ inputs.mode }}
      LENGTH: ${{ inputs.length }}
      VOICE: ${{ inputs.voice }}
      ANGLE: ${{ inputs.angle }}
      PREVIEW: ${{ inputs.preview_seconds }}
      FORCE: ${{ inputs.force }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate ASIN
        run: |
          [[ "$ASIN" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{2,39}$ ]] || { echo "Project name must be 3-40 letters, digits, - or _"; exit 1; }
          ASIN=$(echo "$ASIN" | tr a-z A-Z)
          echo "ASIN=$ASIN" >> "$GITHUB_ENV"
          [ -d "projects/$ASIN" ] || { echo "Folder projects/$ASIN not found"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Restore voice/asset cache (saves ElevenLabs credits on re-runs)
        uses: actions/cache@v4
        with:
          path: projects/${{ env.ASIN }}/.cache
          key: adagent-${{ env.ASIN }}-${{ github.run_id }}
          restore-keys: adagent-${{ env.ASIN }}-

      - name: Run
        run: |
          args=("$MODE" "$ASIN")
          if [ "$MODE" = "render" ] || [ "$MODE" = "all" ]; then args+=(--voice "$VOICE"); fi
          if [ "$MODE" != "scenes" ] && [ -n "$LENGTH" ]; then args+=(--length "$LENGTH"); fi
          if [ "$MODE" = "script" ] || [ "$MODE" = "all" ]; then
            if [ -n "$ANGLE" ]; then args+=(--angle "$ANGLE"); fi
          fi
          if [ "$MODE" != "render" ] && [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$MODE" = "render" ] || [ "$MODE" = "all" ]; then
            if [ "$PREVIEW" != "0" ] && [ -n "$PREVIEW" ]; then args+=(--max-seconds "$PREVIEW"); fi
          fi
          python -m adagent "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASIN }}-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            projects/${{ env.ASIN }}/out/*.mp4
            projects/${{ env.ASIN }}/out/*.txt
            projects/${{ env.ASIN }}/out/*.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Save script + anti-duplication history
        if: success()
        continue-on-error: true
        run: |
          mkdir -p /tmp/keep/scripts_archive
          rm -f /tmp/keep/script.md
          rm -f /tmp/keep/scenes.md
          if [ "$MODE" != "render" ] && [ "$MODE" != "scenes" ] && [ -f "projects/$ASIN/script.md" ]; then cp "projects/$ASIN/script.md" /tmp/keep/script.md; fi
          if [ "$MODE" = "scenes" ] && [ -f "projects/$ASIN/scenes.md" ]; then cp "projects/$ASIN/scenes.md" /tmp/keep/scenes.md; fi
          cp -r scripts_archive/. /tmp/keep/scripts_archive/ 2>/dev/null || true
          git config user.name "adagent"
          git config user.email "adagent@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            if [ -f /tmp/keep/script.md ]; then cp /tmp/keep/script.md "projects/$ASIN/script.md"; fi
            if [ -f /tmp/keep/scenes.md ]; then cp /tmp/keep/scenes.md "projects/$ASIN/scenes.md"; fi
            mkdir -p scripts_archive && cp -r /tmp/keep/scripts_archive/. scripts_archive/ 2>/dev/null || true
            git add "projects/$ASIN/script.md" "projects/$ASIN/scenes.md" scripts_archive 2>/dev/null || true
            if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
            git commit -qm "script/history for $ASIN"
            if git push -q origin HEAD:main; then echo "saved"; exit 0; fi
            sleep 5
          done
          exit 1
